name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

      # No API key here on purpose: the suite runs entirely offline.
      - run: pytest
