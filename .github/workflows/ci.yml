name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor in pyproject: StrEnum and datetime.UTC land there.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

      # No API key here on purpose: the suite runs entirely offline.
      - run: pytest
