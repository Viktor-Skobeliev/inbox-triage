[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-triage"
version = "0.1.0"
description = "LLM-based triage of free-form internal requests into a validated structure"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
inbox-triage = "inbox_triage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt text and the worked example are data, not code: rewrapping them would
# change what the model actually receives.
"src/inbox_triage/prompts.py" = ["E501"]
# Holds a CSV fixture with realistic request texts; wrapping them would change
# what the rules are tested against.
"tests/test_end_to_end.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["inbox_triage"]
